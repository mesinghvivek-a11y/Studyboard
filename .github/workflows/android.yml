name: Build Android APK from HTML Website

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Convert Website to Android (Capacitor)
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli
        npx cap init Studyboard com.example.studyboard --web-dir=.
        npm install @capacitor/android
        npx cap add android
        npx cap sync

    - name: Compile APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: studyboard-android-app
        path: android/app/build/outputs/apk/debug/app-debug.apk
