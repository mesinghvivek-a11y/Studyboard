name: Build Android APK from HTML Website

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'zulu'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Prepare Web Directory and Convert (Capacitor)
      run: |
        # Create a web directory and move site assets into it
        mkdir www
        find . -maxdepth 1 -type f -not -name "package*" -not -name "README*" -exec cp {} www/ \;
        # If you have assets/css/js folders at the root, copy them too:
        find . -maxdepth 1 -type d -not -name "." -not -name ".." -not -name ".git" -not -name ".github" -not -name "www" -not -name "node_modules" -exec cp -r {} www/ \; || true
        
        # Initialize and build Capacitor app using the 'www' directory
        npm init -y
        npm install @capacitor/core @capacitor/cli
        npx cap init Studyboard com.example.studyboard --web-dir=www
        npm install @capacitor/android
        npx cap add android
        npx cap sync

    - name: Compile APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: studyboard-android-app
        path: android/app/build/outputs/apk/debug/app-debug.apk
