            KYchDXw7L8rgA/J3z6a4dDFq/plE5uQijDiLUEjvBbv+b8+6VoR4uxuOQ+clkiv7znGJYQssO2YhaEzhpmIjfrxd++DDtPuY10YDZaO6bgYd/BA95DI0AGuNZY+9ctPuxsLRoCEnimMZdg8JrEcL58yX1mxJBMkO
            Ebl79jmvsZAmC0Z6Lu/A6ODpP1BLAQIUABQAAAAIAAAAdVzWnvWbRwYAAJsOAAAcAAAAAAAAAAAAAACAAQAAAABzY3JpcHRzL2J1aWxkLXN0dWR5Ym9hcmQubWpzUEsBAhQAFAAAAAgAAAB1XIJZhyIDCAAAdRIA
            ABsAAAAAAAAAAAAAAIABgQYAAHNjcmlwdHMvc3R1ZHlib2FyZC1kZW1vLm1qc1BLAQIUABQAAAAIAAAAdVzhy8bdGQcAAC4TAAAaAAAAAAAAAAAAAACAAb0OAAB0ZXN0cy9zdHVkeWJvYXJkLXNtb2tlLmNqc1BL
            AQIUABQAAAAIAAAAdVysg+Si4QAAAOYBAAALAAAAAAAAAAAAAACAAQ4WAAB2ZXJjZWwuanNvblBLAQIUABQAAAAIAAAAdVyPvB2RHBkAAEVPAAAJAAAAAAAAAAAAAACAARgXAABhcHBseS5janNQSwECFAAUAAAA
            CAAAAHVc82beMKECAADSBQAAEQAAAAAAAAAAAAAAgAFbMAAAd29ya2VyLXByZWZpeC50eHRQSwUGAAAAAAYABgCKAQAAKzMAAAAA
        run: |
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, zipfile, io
          external = pathlib.Path('.github/studyboard-performance-update.zip')
          raw = external.read_bytes() if external.is_file() else base64.b64decode(os.environ['EMBEDDED_UPDATE'])
          if external.is_file() and hashlib.sha256(raw).hexdigest() == os.environ['PREVIOUS_SHA256']:
              print('Using the bundled update with the corrected timer check.')
              raw = base64.b64decode(os.environ['EMBEDDED_UPDATE'])
          if hashlib.sha256(raw).hexdigest() != os.environ['EXPECTED_SHA256']:
              raise SystemExit('The ZIP and workflow are from different releases. Upload the matching pair.')
          target = pathlib.Path(os.environ['RUNNER_TEMP'], 'studyboard-update')
          allowed = {'apply.cjs', 'worker-prefix.txt', 'scripts/build-studyboard.mjs', 'scripts/studyboard-demo.mjs', 'tests/studyboard-smoke.cjs', 'vercel.json'}
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              if set(z.namelist()) != allowed or len(z.namelist()) != len(allowed) or z.testzip():
                  raise SystemExit('Invalid Study Board archive.')
              for name in sorted(allowed):
                  destination = target / name
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(z.read(name))
          PY
      - name: Build production and the isolated preview
        shell: bash
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/studyboard-update/apply.cjs"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          raw = p.read_bytes()
          html = raw.decode().replace('\r\n', '\n')
          old = "    const res = await window.storage.get('study-board-profile', false).catch(()=>null);"
          new = """    performance.mark('studyboard-account-ready');
              const firstBoardRead = getDocFromServer(doc(db, 'boards', user.uid)).then(
                snapshot => { performance.mark('studyboard-board-read'); return {snapshot}; }, error => ({error})
              );
          """ + old
          changes = [(old,new),
              ('  async function loadState(){','  async function loadState(firstBoardRead){'),
              ("        snap = await getDocFromServer(doc(db, 'boards', me.id));", """        if(firstBoardRead){
                    const initial = await firstBoardRead;
                    firstBoardRead = null;
                    if(initial.error) throw initial.error;
                    snap = initial.snapshot;
                  }else{
                    snap = await getDocFromServer(doc(db, 'boards', me.id));
                  }"""),
              ('    await loadState();', """    if(me.id !== user.uid) throw Error('The profile does not match the signed-in account.');
              await loadState(firstBoardRead);""")]
          metric = "+(performance.now()/1000).toFixed(2)+' s';"
          ready_time = metric + """
                if(new URLSearchParams(location.search).has('perf')){
                  const account = performance.getEntriesByName?.('studyboard-account-ready')?.at(-1);
                  const board = performance.getEntriesByName?.('studyboard-board-read')?.at(-1);
                  if(account && board) metric.textContent += ' · Account ready at '+(account.startTime/1000).toFixed(2)+' s · Board read '+((board.startTime-account.startTime)/1000).toFixed(2)+' s';
                }"""
          changes.append((metric, ready_time))
          if all(html.count(after)==1 for _, after in changes):
              print('Concurrent startup reads already installed.')
          else:
              for before, after in changes:
                  if html.count(before)!=1: raise SystemExit('Startup code changed. Review the file before applying this update.')
                  html=html.replace(before,after)
              p.write_bytes((html.replace('\n','\r\n') if b'\r\n' in raw else html).encode())
          PY
          node scripts/build-studyboard.mjs --production
          for js in dist/assets/*.mjs dist/sw.js; do node --check "$js"; done
          test -f dist/.well-known/assetlinks.json
          node scripts/build-studyboard.mjs --preview
          for js in dist/assets/*.mjs dist/sw.js; do node --check "$js"; done
      - name: Check the timer, tabs, save and reload in Chrome
        shell: bash
        run: |
          set -euo pipefail
          testtools="$RUNNER_TEMP/studyboard-browser"
          npm install --prefix "$testtools" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1
          export NODE_PATH="$testtools/node_modules"
          if command -v google-chrome >/dev/null; then
            export CHROME_PATH="$(command -v google-chrome)"
          else
            node "$testtools/node_modules/playwright/cli.js" install --with-deps chromium
          fi
          node tests/studyboard-smoke.cjs
      - name: Prepare verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git add -- index.html sw.js vercel.json scripts/build-studyboard.mjs scripts/studyboard-demo.mjs tests/studyboard-smoke.cjs
          git -c core.whitespace=trailing-space,space-before-tab,cr-at-eol diff --cached --check
          git diff --cached --binary --full-index > "$RUNNER_TEMP/studyboard.patch"
          if ! git diff --cached --quiet; then echo 'changed=true' >> "$GITHUB_OUTPUT"; fi
        id: changes
      - name: Downloadable fixed application files
        uses: actions/upload-artifact@v6
        with:
          name: Studyboard-fixed-files
          overwrite: true
          if-no-files-found: error
          path: |
            index.html
            sw.js
            vercel.json
            scripts/build-studyboard.mjs
            scripts/studyboard-demo.mjs
            tests/studyboard-smoke.cjs
      - name: Transfer verified diff
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: studyboard-reviewed-diff
          overwrite: true
          path: ${{ runner.temp }}/studyboard.patch
          retention-days: 3
    outputs:
      changed: ${{ steps.changes.outputs.changed }}

  review:
    name: Create review branch
    needs: verify
    if: needs.verify.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v7
        with:
          name: studyboard-reviewed-diff
          path: ${{ runner.temp }}/studyboard-patch
      - name: Push review branch and open pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          branch="studyboard-performance-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git switch -c "$branch"
          git apply --check "$RUNNER_TEMP/studyboard-patch/studyboard.patch"
          git apply --index "$RUNNER_TEMP/studyboard-patch/studyboard.patch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Load the Study Board profile and board concurrently'
          git push origin "HEAD:refs/heads/$branch"
          body="$RUNNER_TEMP/review.md"
          cat > "$body" <<'BODY'
          The workflow built the production and sample-data versions and ran the browser checks. The Vercel preview uses an isolated sample board. Open Now, start a task, switch to To-Do, expand a Plan and save a task. Reload to check that the edit persists.
          BODY
          if result=$(gh pr create --base "$BASE" --head "$branch" --title 'Improve Study Board performance' --body-file "$body"); then
            echo "[Open the review pull request]($result)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "[Create the pull request]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$BASE...$branch?expand=1)" >> "$GITHUB_STEP_SUMMARY"
          fi
